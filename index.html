<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#111111" />
  <meta name="description" content="Confira os produtos que indiquei no TikTok e acesse os links aqui." />
  <title>Meus achadinhos | Links</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page">
    <header class="profile">
      <!-- Troque assets/perfil.jpg pela foto que deseja usar. -->
      <img class="avatar" src="assets/perfil.svg" alt="Foto do criador" />
      <h1>👑ReiRecomenda</h1>
      <p class="bio">Clique no produto que deseja e você sera redirencionado ✨</p>
      <div class="social-proof">🛍️ Produtos que mostro no TikTok</div>
    </header>

    <section class="catalog" aria-labelledby="catalog-title">
      <div class="section-heading">
        <div>
          <span class="eyebrow">VITRINE DE ACHADINHOS</span>
          <h2 id="catalog-title">Encontre seu favorito</h2>
        </div>
        <span class="item-count" id="item-count">0 itens</span>
      </div>
      <div class="product-grid" id="product-grid"></div>
    </section>

    <footer>
      <p>Alguns links podem ser de afiliado. Posso receber uma comissão pela compra, sem custo adicional para você.</p>
      <span>Feito com carinho 💛</span>
    </footer>
  </main>
  <script src="script.js"></script>
</body>
</html>
